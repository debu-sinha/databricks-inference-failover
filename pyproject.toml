[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-failover-reference"
version = "0.1.0"
description = "Explicit application fallback for nonstreaming inference requests"
requires-python = ">=3.11"
authors = [{name = "Debu Sinha"}]
license = "MIT"

[project.optional-dependencies]
auth = ["databricks-sdk==0.110.0"]
dev = ["pytest==8.4.2", "ruff==0.15.17", "mypy==1.19.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "examples"]

[tool.setuptools.package-data]
inference_failover = ["py.typed"]
